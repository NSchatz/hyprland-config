# hyprlock — screen locker config (read by hyprlock, not source=d)
# Required: hyprlock errors out if this file is missing.

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(cba6f7)    # palette accent (literal — hyprlock can't read $accent)
    inner_color = rgb(313244)
    font_color = rgb(cdd6f4)
    placeholder_text = <i>Password...</i>
    fade_on_empty = true
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Inter    # the UI font chosen in Area C-theme
    position = 0, 80
    halign = center
    valign = center
}
