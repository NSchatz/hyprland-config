# Autostart (exec-once runs at launch)

# Polkit agent (first-party)
exec-once = systemctl --user start hyprpolkitagent

# Wallpaper
exec-once = hyprpaper

# Bar + notifications
exec-once = waybar
exec-once = mako

# Idle daemon (drives hyprlock via loginctl lock-session)
exec-once = hypridle

# Trays + clipboard history
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store
