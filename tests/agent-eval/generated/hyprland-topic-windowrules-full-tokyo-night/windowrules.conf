# windowrules.conf - generated by rice (Hyprland 0.55.0)
# Sourced from hyprland.conf. Uses unified block form (0.53+).

# ------------------------------------------------------------
# Shipped defaults (broadly useful - every rice inherits these)
# ------------------------------------------------------------

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# ------------------------------------------------------------
# Float common utility dialogs
# ------------------------------------------------------------

windowrule {
    name = float-utilities
    match:class = ^(pavucontrol|nm-connection-editor|blueman-manager)$
    float = yes
}

# ------------------------------------------------------------
# Idle-inhibit while fullscreen (video / games don't trigger idle)
# ------------------------------------------------------------

windowrule {
    name = idleinhibit-fullscreen
    match:fullscreen = true
    idle_inhibit = fullscreen
}

# ------------------------------------------------------------
# Smart gaps - pair with `workspace = w[tv1], gapsout:0, gapsin:0`
# in monitors.conf (monitors.workspace_rules.smart_gaps = true).
# ------------------------------------------------------------

windowrule {
    name = smartgaps-bordersize
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
}

windowrule {
    name = smartgaps-rounding
    match:float = false
    match:workspace = w[tv1]
    rounding = 0
}

# ------------------------------------------------------------
# App -> workspace pins (monitors.pin_apps)
# `silent` so launches don't yank focus from the user's current workspace.
# ------------------------------------------------------------

windowrule {
    name = pin-firefox
    match:class = ^(firefox)$
    workspace = 1 silent
}

windowrule {
    name = pin-kitty
    match:class = ^(kitty)$
    workspace = 2 silent
}

windowrule {
    name = pin-Spotify
    match:class = ^(Spotify)$
    workspace = 9 silent
}

# ------------------------------------------------------------
# Per-app rules (look_feel.per_app_rules)
# Effects emitted verbatim from the answer.
# ------------------------------------------------------------

windowrule {
    name = app-pavucontrol-nm-blueman
    match:class = ^(pavucontrol|nm-connection-editor|blueman-manager)$
    float = yes
    size 720 480
    center
}

windowrule {
    name = app-polkit-agents
    match:class = ^(org\.kde\.polkit-kde-authentication-agent-1|hyprpolkitagent)$
    float = yes
    pin
}

windowrule {
    name = app-firefox-pip
    match:class = ^(firefox)$
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin
    noanim
    opacity 1.0
}

windowrule {
    name = app-steam
    match:class = ^(steam)$
    workspace 6 silent
}

# ------------------------------------------------------------
# Gaming: tearing classes (gaming.tearing_classes)
# `immediate = true` allows tearing on these apps for lower input latency.
# ------------------------------------------------------------

windowrule {
    name = tearing-games
    match:class = ^(cs2|hl2_linux|portal2_linux)$
    immediate = true
}

# ------------------------------------------------------------
# Layer-shell blur (0.54+ block form)
# bar.transparency = translucent -> waybar blur with xray + blur_popups.
# ------------------------------------------------------------

layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
    blur_popups = true
    xray = true
    ignore_alpha = 0.5
}

# Launcher: wofi -> namespace `wofi`
layerrule {
    name = blur-wofi
    match:namespace = wofi
    blur = true
    ignore_alpha = 0.5
}

# Notifications: mako -> single block on namespace `notifications`
layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur = true
    ignore_alpha = 0.0
}

# Session picker: wlogout -> namespace `logout_dialog`
layerrule {
    name = blur-logout_dialog
    match:namespace = logout_dialog
    blur = true
    ignore_alpha = 0.0
}
