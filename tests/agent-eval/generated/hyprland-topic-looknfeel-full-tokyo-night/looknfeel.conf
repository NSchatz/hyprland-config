# ──────────────────────────────────────────────────────────────────────────────
# Hyprland look & feel — generated by hypr-rice.
# Palette vars come from ../colors.conf (sourced ahead of this file in hyprland.conf).
# Re-theme by editing answers.json + re-running `rice apply`, or `rice retheme`.
# Target: HYPR_VERSION = 0.55.0
# ──────────────────────────────────────────────────────────────────────────────

general {
    gaps_in     = 5
    gaps_out    = 20
    border_size = 2

    # Extra spacing during workspace-switch animations. Stacks with gaps_out.
    # Default 0 (workspaces butt against each other). 0–100 int.
    gaps_workspaces   = 0

    # Border colour. border_color=palette → $accent → $accent2 gradient at 45°.
    col.active_border   = $accent $accent2 45deg
    col.inactive_border = $surface

    # "Window-cannot-be-grouped" border tint — re-tint from palette so they
    # don't read as a UI glitch (upstream defaults are loud pink/magenta).
    col.nogroup_border        = $surface
    col.nogroup_border_active = $accent2

    layout            = dwindle
    resize_on_border  = true
    allow_tearing     = false
}

decoration {
    rounding = 10
    rounding_power = 2          # 0.47+ — corner curve exponent; default 2.0 (range [2, 10])

    active_opacity   = 1.0
    inactive_opacity = 0.92

    blur {
        enabled  = true
        size     = 8     # default 8
        passes   = 1     # default 1
        vibrancy = 0.1696
    }

    shadow {
        enabled       = true
        range         = 4
        render_power  = 3
        color         = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = workspaces,    1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

# 0.55+: vfr was reclassified from misc → debug.
misc {
    disable_hyprland_logo = true

    # Compositor fallback background color — tied to $bg so the brief flash
    # before hyprpaper paints matches the palette instead of jumping black.
    background_color      = rgb($bg)

    # Variable Refresh Rate — adaptive sync (FreeSync / G-SYNC).
    # 0 = off, 1 = on, 2 = fullscreen-only. Distinct from `debug:vfr` (frame-rate).
    vrr                   = 0
}

debug {
    # FRAME-rate optimisation (skip repaints when nothing's moving).
    # Default `true` on 0.55+ — explicit for clarity. NOT the same as `misc:vrr`.
    vfr = true
}

# Window groups / tabs — opted in via 11h. Themed from the palette like waybar.
group {
    col.border_active          = $accent
    col.border_inactive        = $muted
    col.border_locked_active   = $accent2
    col.border_locked_inactive = $surface

    groupbar {
        enabled            = true
        font_size          = 11
        height             = 18
        gradients          = true
        gradient_rounding  = 10
        gradient_round_only_edges = true

        text_color         = $fg
        col.active         = $accent
        col.inactive       = $surface
        col.locked_active  = $accent2
        col.locked_inactive = $surface
        middle_click_close = true    # 0.55+
    }
}
# Binds emitted by `keybinds`: SUPER+G togglegroup; SUPER+TAB changegroupactive.
