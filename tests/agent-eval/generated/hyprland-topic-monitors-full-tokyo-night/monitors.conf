# Monitors: NAME, RESOLUTION@REFRESH, POSITION, SCALE
# Real names from `hyprctl monitors`. Adjust if these are placeholders.
monitor = DP-1, 2560x1440@144, 0x0, 1, vrr, 2, bitdepth, 10
monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1

# Fallback rule for any monitor not listed above (covers hotplug / docks):
monitor = , preferred, auto, 1

# --- Workspace rules -----------------------------------------------------------
# Per-monitor binding (1-5 on DP-1, 6-10 on HDMI-A-1); persistent on 1, 2, 9.
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1, persistent:true
workspace = 10, monitor:HDMI-A-1

# Named scratchpad — toggle with the special-workspace bind in binds.conf.
# `gapsout:30` gives the scratchpad breathing room so it reads as floating-above,
# not tiled-on-top — pattern from end-4/dots-hyprland. Rice gap-preset is
# "comfortable" so the spacious special-gap reads correctly.
workspace = special:magic, on-created-empty:$terminal, gapsout:30

# Smart gaps — no gaps/border when a workspace holds a single tiled window.
# `s[false]` excludes special workspaces so the scratchpad keeps its outer gaps
# even with one tiled window. Pattern from caelestia-dots/caelestia.
workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0
windowrule {
  name = smartgaps-noborder
  match:float = 0
  match:workspace = w[tv1]
  border_size = 0
}
windowrule {
  name = smartgaps-norounding
  match:float = 0
  match:workspace = w[tv1]
  rounding = 0
}
