input {
    kb_layout = us
    kb_variant =
    kb_options = caps:swapescape,compose:ralt
    follow_mouse = 1     # 0=disabled, 1=follow (default, hover focuses), 2=detached, 3=separate
    repeat_rate = 25     # Hyprland default; emitted explicitly for clarity
    repeat_delay = 600   # Hyprland default; emitted explicitly for clarity

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        tap-to-click = true
    }
}

# Gestures — 0.45+ keyword API (one keyword per gesture).
# Syntax: gesture = FINGERS, DIRECTION [, mod:MODS] [, scale:F], ACTION [, ARG]
# On 0.51+ (this target = 0.55.0) the legacy gestures:workspace_swipe / _fingers /
# _min_fingers keys are REMOVED — do not emit them. Tuning keys under gestures {}
# still exist if needed; not required here.
gesture = 3, horizontal, workspace      # 3-finger swipe ⇄ change workspace
gesture = 4, horizontal, move           # 4-finger drag moves the window
gesture = 3, up, fullscreen             # 3-finger up → fullscreen
