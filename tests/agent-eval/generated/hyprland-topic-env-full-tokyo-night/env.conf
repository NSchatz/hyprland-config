# Environment — sourced first so later programs inherit these.
# Syntax: `env = NAME,value` (parser splits on the FIRST comma only).
# `envd = NAME,value` ALSO pushes the var into the systemd / D-Bus activation
# environment — required for XDG_CURRENT_DESKTOP so portals / DBus-activated
# apps pick it up (Matt-FTW pattern).

# --- Session / portal handshake ---
envd = XDG_CURRENT_DESKTOP,Hyprland    # envd (not env) — pushes into D-Bus + systemd

# --- Toolkit (Wayland-native rendering for GTK / Qt / SDL / Clutter / Java AWT) ---
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1    # fixes blank Java AWT windows on tiling WMs

# --- Firefox ---
env = MOZ_ENABLE_WAYLAND,1

# --- Electron / Chromium ---
env = ELECTRON_OZONE_PLATFORM_HINT,auto   # safe on any GPU — fixes Electron/CEF flicker

# --- Extra passthrough (entries from autostart_env.env that don't match a gate) ---
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
