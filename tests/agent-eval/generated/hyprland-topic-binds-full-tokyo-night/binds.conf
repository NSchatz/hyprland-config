# ----------------------------------------------------------------------------
# Hyprland binds — generated by the hyprland-config plugin
# Target version: 0.55.0
# Flavor: i3-sway · vim HJKL · resize submap · OSD route: swayosd
# Variables ($mainMod, $terminal, $menu, $dmenu, $browser, $fileManager) are
# defined in hyprland.conf which sources this file.
# ----------------------------------------------------------------------------

# ----- Apps (i3-sway flavor) -----
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser

# ----- Window management (i3-sway flavor) -----
# `exit` dispatcher is still valid on 0.55; users can swap to a hyprshutdown
# wrapper in post if they install one.
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
# vim mode: J is focus-down, so togglesplit moves to T
bind = $mainMod, T, layoutmsg, togglesplit

# ----- Focus (arrows + vim HJKL) -----
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# ----- Move windows -----
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# ----- Workspaces 1-10 (0 = workspace 10) -----
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ----- Scratchpad (special workspace) -----
bind = $mainMod, S,       togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ----- Mouse move/resize -----
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ----- Laptop lid (suspend) -----
# bindl fires even when locked.
bindl = , switch:on:Lid Switch, exec, systemctl suspend

# ----- Media & brightness (swayosd route) -----
# swayosd-client owns the visual; swayosd-server is autostarted (see autostart.conf).
bindel = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# ----- Screenshots (grim + slurp fallback — no specific tool selected) -----
bind = , Print,         exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy

# ----- Ecosystem binds -----
bind = $mainMod, X,       exec, hyprlock
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod SHIFT, M, exec, wlogout -p layer-shell
# cliphist uses $dmenu (NOT $menu) — `$menu -dmenu` would expand to two conflicting mode flags.
bind = $mainMod SHIFT, V, exec, cliphist list | $dmenu -i -p "Clipboard" | cliphist decode | wl-copy

# ----- Util-script binds -----
bind = $mainMod, slash,   exec, ~/.config/hypr/scripts/keybind-cheatsheet.sh
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/blur-toggle.sh
bind = $mainMod, F1,      exec, ~/.config/hypr/scripts/gamemode.sh

# ----- Theme toggle (extras: theme-toggle) -----
bind = $mainMod CTRL, T,  exec, ~/.config/hypr-rice/rice theme-toggle catppuccin-latte tokyo-night

# ----- Resize submap -----
# SUPER+R enters; arrows + HJKL resize; Esc exits via submap = reset.
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive,  10   0
binde = , left,  resizeactive, -10   0
binde = , up,    resizeactive,   0 -10
binde = , down,  resizeactive,   0  10
binde = , L, resizeactive,  10   0
binde = , H, resizeactive, -10   0
binde = , K, resizeactive,   0 -10
binde = , J, resizeactive,   0  10
bind = , escape, submap, reset
submap = reset

# ----- Plugin dispatchers (kept COMMENTED until plugin is built + loaded) -----
# Uncommented plugin dispatchers HARD-ERROR the reload — see gotchas.md.
# bind = $mainMod, Tab, hyprexpo:expo, toggle
