# ~/.config/hypr/hyprlock.conf — generated by rice
# Palette: tokyo-night (bg=1a1b26, fg=c0caf5, surface=24283b, accent=7aa2f7)
# Colors are LITERAL hex; hyprlock can't read Hyprland $vars (see gotchas.md).
$font = Inter

general {
    hide_cursor = true
    ignore_empty_input = true
    # NOTE: `grace` is NOT a config key — it's a CLI flag (`hyprlock --grace N`).
    # Pass it via the launcher (binds.conf / hypridle lock_cmd) instead.
}

# ---------- background ----------
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.70
    vibrancy = 0.17
}

# ---------- input-field (accent-outlined pill) ----------
input-field {
    monitor =
    size = 280, 55
    rounding = -1
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    outer_color = rgb(7aa2f7)
    inner_color = rgb(24283b)
    font_color  = rgb(c0caf5)
    check_color = rgb(9ece6a)
    fail_color  = rgb(f7768e)
    placeholder_text = <i>Password…</i>
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}

# ---------- clock (large) ----------
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb(c0caf5)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = rgb(c0caf5)
    position = 0, 90
    halign = center
    valign = center
}
