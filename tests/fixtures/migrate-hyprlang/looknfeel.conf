general {
    gaps_in  = 5
    # Space-separated: hyprlang reads this as 6 on every side.
    gaps_out = 6 16 16 16
    # Comma-separated: the css shorthand, top right bottom left.
    float_gaps = 4, 8, 12, 16
    border_size = 2

    # A three-stop gradient with an angle.
    col.active_border   = $accent $accent2 $accent 45deg
    col.inactive_border = $surface
    layout = dwindle
    resize_on_border = on
}

decoration {
    rounding = 10
    shadow {
        enabled = yes
        offset  = 0 4
        color   = $accentShadow
        color_inactive = rgba(00000000)
    }
}

animations {
    enabled = true

    # One overshoot curve, one ease-out.
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05
    bezier = easeOut,   0.23, 1,   0.32, 1

    animation = global,     1, 10,  default
    animation = windowsIn,  1, 4.1, overshoot, popin 87%
    animation = workspaces, 1, 3,   easeOut,   slidefade 15%
    animation = fadeDim,    0
}

input {
    kb_layout  = no        # Norwegian: a layout name, not a boolean
    kb_variant =
    follow_mouse = 1

    touchpad {
        tap-to-click = true
        natural_scroll = no
    }
}

dwindle {
    pseudotile = true      # removed in 0.55: there is no lua option of this name
    preserve_split = true
}

misc {
    background_color = $bg
    swallow_regex    = ^(kitty)$
}

group {
    col.border_active = $accent $accent2 90deg
    groupbar {
        col.active = $accent
        text_color = $bg
    }
}

gesture = 3, horizontal, workspace
