# Every dispatcher the plugin's own keybind templates emit, in the legacy spelling.

# ----- Apps -----
bindd = $mainMod, Return, Open terminal, exec, $terminal
bind  = $mainMod, D, exec, $menu

# ----- Windows -----
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pseudo,
bind = $mainMod ALT, P, pin,
bind = $mainMod ALT, C, centerwindow,
bind = $mainMod, T, layoutmsg, togglesplit
bind = ALT, Tab, focuscurrentorlast,
bind = $mainMod CTRL, O, setprop, active opaque toggle

# ----- Focus and move -----
bind = $mainMod, left, movefocus, l
bind = $mainMod, K, movefocus, u
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, J, movewindow, d

# ----- Groups -----
bind = $mainMod, G, togglegroup,
bind = $mainMod ALT, G, moveoutofgroup,
bind = $mainMod ALT, Tab, changegroupactive, f
bind = $mainMod ALT SHIFT, Tab, changegroupactive, b
bind = $mainMod ALT, H, moveintoorcreategroup, l

# ----- Workspaces -----
bind = $mainMod, 1, workspace, 1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod CTRL, Tab, workspace, previous
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# ----- Mouse (bindm) and media (bindel / bindl) -----
bindm  = $mainMod, mouse:272, movewindow
bindm  = $mainMod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl  = , XF86AudioNext, exec, playerctl next

# ----- Session and zoom: shell commands that call hyprctl the legacy way -----
bind   = $mainMod, M, exec, hyprctl dispatch exit
bindde = $mainMod, equal, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float*1.25')
bind   = $mainMod, Z, exec, pkill foo && hyprctl keyword general:gaps_in 0

# ----- Resize submap -----
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive,  10 0
binde = , up,    resizeactive,   0 -10
bind  = , escape, submap, reset
submap = reset

# ----- Things with no lua form the converter can write -----
bind = $mainMod, X, nosuchdispatcher, 1
bind = $mainMod, Y, exec, [float; size 800 600] kitty
