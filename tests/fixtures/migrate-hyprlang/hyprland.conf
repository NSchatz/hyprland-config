# Fixture for tests/test_lua_migrate_api.sh: a hyprlang config set that uses every construct
# the lua converter has to place. Not a config anyone runs - each line is here because a
# conversion once got it wrong, or could.

$mainMod  = SUPER
$terminal = kitty
$menu     = rofi -show drun   # the launcher

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/rules.conf
