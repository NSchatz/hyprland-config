windowrule {
    name = float-dialogs
    match:class = ^(pavucontrol|blueman-manager)$
    match:float = false
    float = yes
    size  = (monitor_w*0.5) (monitor_h*0.5)
    opacity = 0.9 override 0.9 override   # fixed, not multiplied
}

windowrule {
    name = ws-chat
    match:class = ^(discord)$
    workspace = 4 silent
}

layerrule {
    name = blur-bar
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.5
}

# Scratchpads: the app launches the first time the workspace opens.
workspace = special:term, on-created-empty:kitty --class dropterm
workspace = 2, monitor:DP-1, default:true, gapsout:0, border:false
