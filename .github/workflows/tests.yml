name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two jobs: a fast "unit" pass that runs on every push, and a slower "integration" pass that
# actually boots Hyprland headlessly inside a container and runs hyprctl reload against a
# generated config. The integration pass is the only place the heavy build (Arch + Hyprland +
# companions) happens.

jobs:
  unit:
    name: Unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show env
        run: |
          bash --version | head -n1
          jq --version
          git --version
          shellcheck --version | head -n2 || true

      - name: Run test suite
        run: bash tests/run.sh

  integration:
    name: Hyprland headless integration
    runs-on: ubuntu-latest
    # Don't gate the cheap unit pass on the slow build.
    needs: unit
    steps:
      - uses: actions/checkout@v4

      # Docker is preinstalled on ubuntu-latest runners; just make sure it's running.
      - name: Verify docker
        run: |
          docker --version
          docker info | head -n 5

      # The image is ~1-2 GB and stable; cache it so most runs pull from the cache instead of
      # rebuilding for every PR. We key on the Dockerfile + the in-container script.
      - name: Cache Hyprland container image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/hypr-image.tar
          key: hyprland-test-image-${{ hashFiles('tests/integration/Dockerfile', 'tests/integration/run-in-container.sh') }}

      - name: Load cached image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/hypr-image.tar

      - name: Build image (cache miss)
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t hyprland-config-test tests/integration
          docker save hyprland-config-test -o /tmp/hypr-image.tar

      - name: Run integration test
        env:
          RUN_INTEGRATION: "1"
        run: bash tests/run.sh integration_docker

  visual:
    name: Theme screenshots
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Verify docker
        run: docker --version

      # Same caching strategy as the integration job — the image is heavier here (sway +
      # waybar + kitty + mako + wofi + grim + fonts), so the cache is the difference between
      # a 30s run and a 5-minute build.
      - name: Cache visual container image
        id: visual-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/hypr-visual-image.tar
          key: hyprland-visual-image-${{ hashFiles('tests/visual/Dockerfile', 'tests/visual/run-screenshots.sh') }}

      - name: Load cached image
        if: steps.visual-image-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/hypr-visual-image.tar

      - name: Build image (cache miss)
        if: steps.visual-image-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t hyprland-config-visual tests/visual
          docker save hyprland-config-visual -o /tmp/hypr-visual-image.tar

      - name: Run screenshot generator
        env:
          RUN_VISUAL: "1"
        run: bash tests/run.sh visual_themes

      # Upload regardless of test outcome — even a partial set of screenshots is useful for
      # diagnosing what broke. The retention is short so we don't pile up artifacts.
      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-screenshots
          path: tests/visual/output
          if-no-files-found: warn
          retention-days: 14
